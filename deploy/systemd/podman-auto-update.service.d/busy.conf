# A drop-in for podman-auto-update.service, installed under
# ~/.config/systemd/user/podman-auto-update.service.d/: the nightly update
# is skipped, without failing the unit, while a round accepts ballots
# (deploy/not-busy.sh asks the app's health check).
[Service]
ExecCondition=%h/school-election/not-busy.sh
