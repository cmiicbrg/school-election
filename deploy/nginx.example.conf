# Example nginx site in front of the app on 127.0.0.1:3000. Replace
# wahl.example.org, put the file into /etc/nginx/sites-available/ and enable
# it; README.md in this directory has the steps.
#
# nginx terminates TLS, forwards and logs, nothing more. Authorization and
# the security headers (CSP, HSTS, Referrer-Policy, ...) come from the app on
# every response, so add no add_header or auth directives here.

# Method and path only: no query string (sign-in returns with ?code= and
# ?state=), no cookies, no referrer, no user agent.
log_format school_election '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

upstream school_election {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name wahl.example.org;

    # Only redirects, so nothing is worth a log line here, and a voter who
    # typed http:// would otherwise be logged with address and time.
    access_log off;

    # Certificates from certbot certonly --webroot -w /var/www/certbot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Needs nginx 1.25.1 or newer. On an older one, remove this line and
    # write `listen 443 ssl http2;` (and the same for [::]:443) instead.
    http2 on;
    server_name wahl.example.org;

    ssl_certificate /etc/letsencrypt/live/wahl.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wahl.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/school-election.access.log school_election;
    error_log /var/log/nginx/school-election.error.log;

    # Nothing the app sends or receives is written to a temp file. Request
    # bodies are passed to the app as they arrive instead of being collected
    # first: a chunked body with many small chunks would otherwise outgrow
    # the buffer and land on disk well below the size limit, which matches
    # the app's 64 KiB. proxy_max_temp_file_size 0 passes a response that
    # outgrows the proxy buffers straight to the client.
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Set, not appended: this is the edge, so whatever X-Forwarded-For a
    # client sends is dropped. The app reads these headers only from the
    # addresses in TRUST_PROXY.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Voting: no access log, because client address and time per request
    # would record who voted when. The error log keeps only critical
    # entries here, since an upstream error line carries the same.
    location /api/voter {
        access_log off;
        error_log /var/log/nginx/school-election.error.log crit;
        proxy_pass http://school_election;
    }

    # Candidate pictures are uploaded as base64 in JSON, which the app
    # accepts up to 352 KiB on this route only; everywhere else 64 KiB.
    location ~ ^/api/elections/[^/]+/candidates/[^/]+/picture$ {
        client_max_body_size 352k;
        client_body_buffer_size 352k;
        proxy_pass http://school_election;
    }

    # Entra returns here with the authorization code and state in the query
    # string, which an upstream error line would quote. Logged like voting.
    location = /api/auth/callback {
        error_log /var/log/nginx/school-election.error.log crit;
        proxy_pass http://school_election;
    }

    location / {
        proxy_pass http://school_election;
    }
}
