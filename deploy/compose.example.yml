# Example deployment for rootless podman compose; README.md in this directory
# walks through it. Copy it to compose.yml next to a .env made from
# .env.example and a secrets/ directory, then:
#
#   podman compose --profile migrate run --rm migrate
#   podman compose up -d
#
# Two networks: the database sits only on `internal`, which has no route off
# the host. The app also joins `egress`, for Entra sign-in and because a port
# cannot be published from a container that is only on an internal network.
#
# Secret files are mounted read-only with `z`: on an SELinux host they are
# relabelled so containers may read them, with the shared label because
# several services mount the same file. Elsewhere `z` changes nothing.

name: school-election

services:
  postgres:
    # scripts/postgres.sh starts this same image for development and CI.
    image: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: always
    # Every setting the app checks at startup (apps/api/lib/db-settings.ts),
    # with the value it requires; with any other value the app refuses to
    # start. apps/api/test/deploy-flags.test.ts keeps this list, the check
    # and scripts/postgres.sh in step.
    command: >-
      postgres
      -c track_commit_timestamp=off
      -c archive_mode=off
      -c wal_recycle=off
      -c wal_keep_size=0
      -c summarize_wal=off
      -c max_replication_slots=0
      -c max_wal_senders=0
      -c log_statement=none
      -c log_error_verbosity=terse
      -c log_min_error_statement=panic
      -c log_parameter_max_length=0
      -c log_parameter_max_length_on_error=0
      -c log_min_duration_statement=-1
      -c log_min_duration_sample=-1
      -c log_transaction_sample_rate=0
      -c log_lock_waits=off
      -c log_duration=off
      -c debug_print_parse=off
      -c debug_print_rewritten=off
      -c debug_print_plan=off
      -c log_statement_stats=off
      -c log_parser_stats=off
      -c log_planner_stats=off
      -c log_executor_stats=off
      -c log_min_messages=warning
      -c log_destination=stderr
    environment:
      POSTGRES_DB: school_election
      POSTGRES_PASSWORD_FILE: /run/secrets/db-owner-password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./secrets/db-owner-password:/run/secrets/db-owner-password:ro,z
    networks:
      - internal
    # No published port: only the app and the migrator reach the database.
    # TCP rather than the socket: on first start the image runs a temporary,
    # socket-only server while it creates the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U postgres -d school_election"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  # One-shot: applies pending migrations and sets the runtime role's
  # password, as the PostgreSQL superuser. Run before every `up -d`; a run
  # with nothing to do changes nothing. The profile keeps `up` from starting it.
  migrate:
    image: ${IMAGE:?set IMAGE in .env}
    profiles:
      - migrate
    command: ["node", "apps/api/scripts/migrate.ts"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgres://postgres@postgres:5432/school_election
      MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/db-owner-password
      DB_RUNTIME_PASSWORD_FILE: /run/secrets/db-runtime-password
    volumes:
      - ./secrets/db-owner-password:/run/secrets/db-owner-password:ro,z
      - ./secrets/db-runtime-password:/run/secrets/db-runtime-password:ro,z
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ${IMAGE:?set IMAGE in .env}
    # With podman-restart.service enabled, `always` also brings the stack
    # back after a reboot.
    restart: always
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      TRUST_PROXY: ${TRUST_PROXY:?set TRUST_PROXY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The unprivileged runtime role the migrator creates. Only its
      # password, the Entra client secret and the session key reach the app;
      # the superuser password stays with the database and the migrator.
      DATABASE_URL: postgres://school_election_app@postgres:5432/school_election
      DATABASE_PASSWORD_FILE: /run/secrets/db-runtime-password
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID in .env}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?set ENTRA_CLIENT_ID in .env}
      ENTRA_CLIENT_SECRET_FILE: /run/secrets/entra-client-secret
      SESSION_KEY_FILE: /run/secrets/session-key
    volumes:
      - ./secrets/db-runtime-password:/run/secrets/db-runtime-password:ro,z
      - ./secrets/entra-client-secret:/run/secrets/entra-client-secret:ro,z
      - ./secrets/session-key:/run/secrets/session-key:ro,z
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - egress
    # Loopback only: nginx on the host is the way in.
    ports:
      - "127.0.0.1:3000:3000"
    # Shell form on purpose: podman-compose joins an exec-form test into one
    # shell string and breaks the quoting of the script. The health check
    # lives under the app's base path, which PUBLIC_URL names.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const p = new URL(process.env.PUBLIC_URL).pathname; fetch('http://127.0.0.1:3000' + (p.endsWith('/') ? p.slice(0, -1) : p) + '/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: {}

networks:
  internal:
    internal: true
  egress: {}
