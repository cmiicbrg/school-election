name: Publish Image

# A release: a v<major>.<minor>.<patch> tag on main, pushed by hand (the
# repository's rulesets let only the maintainer create one, and the check
# below refuses a tag off main). It publishes two images to GHCR, the app
# and its PostgreSQL (deploy/postgres/Dockerfile), each under the release
# tag, an immutable sha-<commit> tag and the floating line tag v<major>,
# which the deployments follow (deploy/quadlet, deploy/README.md): a school's
# podman-auto-update pulls the new v1 the night after. A v2 moves v2
# alone. No `latest`: it would move across major lines. Each image is
# signed with the repository's cosign key, which a host's policy requires
# (deploy/policy.json), so an image that did not come through this
# workflow is refused there.
#
# The order protects the line: the builds push the sha-<commit> tag alone,
# which no host follows; the images are signed and pulled as a host pulls
# them; only then do the release tag and the line tag go onto the verified
# digests, the release tags first, the line tags last, both images in one
# step. A failure before that leaves the line where it was, and the line
# never moves back to an older release. Then the release's notes go to a
# GitHub Release on the tag (scripts/release-notes.mjs: the images with
# their digests, whether the line moved, the migrations new since the
# previous release, the pull requests merged since it).

'on':
  workflow_dispatch: {}
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

env:
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/school-election
  POSTGRES_IMAGE: ghcr.io/${{ github.repository_owner }}/school-election-postgres

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # One release at a time, in the order the tags were pushed, and every
    # one of them: two runs interleaving could move the line to the older
    # of the two, and the default queue of one would drop a tag pushed with
    # two others. The guard before the line moves (below) refuses an older
    # release too.
    concurrency:
      group: publish-images
      cancel-in-progress: false
      queue: max
    # What the release job writes into the notes: the verified digests and
    # the line's decision.
    outputs:
      app-digest: ${{ steps.build.outputs.digest }}
      postgres-digest: ${{ steps.build-postgres.outputs.digest }}
      line: ${{ steps.line.outputs.name }}
      line-moved: ${{ steps.line.outputs.move }}
      line-newer: ${{ steps.line.outputs.newer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch, for the check that the tag is on main below.
          fetch-depth: 0

      # Only a release tag, and only a plain one: a pre-release such as
      # v1.1.0-rc1 would move the v1 line too.
      - name: Verify release tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Refusing to publish: expected a v<major>.<minor>.<patch> tag, got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi

      # The repository-visible half of the tag rulesets (SECURITY.md,
      # Residual risks): a release is a commit of main. The rulesets let
      # only the maintainer create a v* tag and nobody move or delete one;
      # this refuses a tag that points off main all the same, so a tag
      # alone never publishes code main never carried. The checkout above
      # fetched every branch for it (fetch-depth: 0).
      - name: Verify the tag is on main
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet origin/main >/dev/null || { echo "Refusing to publish: origin/main is not in the checkout" >&2; exit 1; }
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Refusing to publish: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not a commit of main" >&2
            exit 1
          fi

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit runs the build and pushes with the job's package token, and
      # its built-in frontend reads the Dockerfiles, which name none of
      # their own: pinned by tag and digest like every image, so a moved
      # tag cannot change what gets signed. Dependabot does not see this
      # pin; it is bumped by hand, here and in ci.yml (npm run lint:deps
      # refuses one without a digest).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=docker.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      # The build pushes sha-<commit> alone; the release and line tags come
      # after the images are verified ("Tag the verified images"). The
      # version label names the release (it named the line, from the line
      # tag, while that was among these).
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: app
        with:
          images: ${{ env.APP_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.app.outputs.tags }}
          labels: ${{ steps.app.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: postgres
        with:
          images: ${{ env.POSTGRES_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-postgres
        with:
          context: deploy/postgres
          push: true
          tags: ${{ steps.postgres.outputs.tags }}
          labels: ${{ steps.postgres.outputs.labels }}

      # The key and its password are repository secrets; deploy/cosign.pub
      # is the public half. Each tag names an index (the image for
      # linux/amd64 and its provenance), and podman checks the signature of
      # the image it takes from the index, not of the index itself, and finds
      # signatures only under cosign's classic tags (sha256-<digest>.sig),
      # not in the bundles cosign 3 stores by default. So every manifest of
      # the index is signed, in the classic format.
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign the images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          APP_DIGEST: ${{ steps.build.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.build-postgres.outputs.digest }}
        run: |
          set -euo pipefail
          for image in "${APP_IMAGE}@${APP_DIGEST}" "${POSTGRES_IMAGE}@${POSTGRES_DIGEST}"; do
            cosign sign --yes --recursive --new-bundle-format=false --use-signing-config=false \
              --key env://COSIGN_PRIVATE_KEY "$image"
          done

      # The check that counts is the host's, not cosign's: cosign verify
      # accepts signatures podman cannot use. So both images are pulled by
      # the podman the units are tested with, under the policy, registry
      # setting and key a host installs from deploy/, unchanged; a pull it
      # refuses fails the release before anything reaches a school.
      - name: Pull the images as a host does
        env:
          APP_DIGEST: ${{ steps.build.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.build-postgres.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --privileged -v "$PWD/deploy:/deploy:ro" \
            -e APP="${APP_IMAGE}@${APP_DIGEST}" -e POSTGRES="${POSTGRES_IMAGE}@${POSTGRES_DIGEST}" \
            quay.io/podman/stable:v5.4@sha256:52536d900c9e7e7cc924bb737eb8c570eeaa3c50f6a3b0b563eb0ec9c48807e4 \
            sh -euc '
              mkdir -p /home/election/school-election /etc/containers/registries.d
              cp /deploy/cosign.pub /home/election/school-election/cosign.pub
              cp /deploy/policy.json /etc/containers/policy.json
              cp /deploy/registries.d/ghcr.yaml /etc/containers/registries.d/ghcr.yaml
              for image in "$APP" "$POSTGRES"; do
                podman --storage-driver vfs pull --quiet "$image"
              done'

      # The line never goes back: it moves only to the highest release tag of
      # its major the repository has, and so to a re-run of that release, but
      # never to an older one. From git, not from the registry: a re-run that
      # failed between its tags can leave the line on a digest that no longer
      # carries its release tag, and a lookup there would read as no line at
      # all. The job runs the tags in the order they were pushed (the
      # concurrency group above), so a newer tag is published after this one.
      - name: Decide whether the line moves
        id: line
        run: |
          set -euo pipefail
          release="${GITHUB_REF_NAME}"
          line="v${release#v}"
          line="${line%%.*}"
          newest="$(git ls-remote --tags --refs origin "refs/tags/${line}.*" | sed 's|.*refs/tags/||' | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)"
          move=yes
          newer=""
          if [ "$newest" != "$release" ]; then
            move=no
            newer="$newest"
            echo "${newer} is a newer release of the ${line} line: ${release} is published under its own tag, and the line does not move back to it." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "move=${move}"
            echo "name=${line}"
            echo "newer=${newer}"
          } >> "$GITHUB_OUTPUT"

      # Only now the tags a host can see: the release tag and the line tag,
      # put on the verified digests themselves (the same index, so the
      # signatures and the provenance stay with it; the digest is checked
      # after each tag, and a registry hiccup is retried). The release tags
      # of both images first, the line tags last, in one step of seconds: a
      # failure before this step leaves nothing but sha-<commit>; a failure
      # between the line tags is healed by running the job again, which tags
      # the same verified digests.
      - name: Tag the verified images
        env:
          APP_DIGEST: ${{ steps.build.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.build-postgres.outputs.digest }}
          MOVE_LINE: ${{ steps.line.outputs.move }}
          LINE: ${{ steps.line.outputs.name }}
        run: |
          set -euo pipefail
          release="${GITHUB_REF_NAME}"
          tag() {
            local image="$1" name="$2" digest="$3" attempt=1 actual
            until docker buildx imagetools create --tag "${image}:${name}" "${image}@${digest}"; do
              if [ "$attempt" -ge 3 ]; then echo "Giving up on ${image}:${name} after ${attempt} attempts" >&2; exit 1; fi
              attempt=$((attempt + 1))
              sleep 5
            done
            actual="$(docker buildx imagetools inspect "${image}:${name}" --format '{{.Manifest.Digest}}')"
            if [ "$actual" != "$digest" ]; then
              echo "Refusing to go on: ${image}:${name} is ${actual}, not the verified ${digest}" >&2
              exit 1
            fi
          }
          tags="$release"
          if [ "$MOVE_LINE" = "yes" ]; then tags="$release $LINE"; fi
          for which in $tags; do
            tag "$APP_IMAGE" "$which" "$APP_DIGEST"
            tag "$POSTGRES_IMAGE" "$which" "$POSTGRES_DIGEST"
          done

      # Expansions go through env rather than straight into the script body:
      # inlining ${{ ... }} splices the value into the shell source before it
      # runs, which is how a crafted value becomes executable code.
      - name: Report the release
        env:
          APP_DIGEST: ${{ steps.build.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.build-postgres.outputs.digest }}
          MOVE_LINE: ${{ steps.line.outputs.move }}
          LINE: ${{ steps.line.outputs.name }}
          LINE_NEWER: ${{ steps.line.outputs.newer }}
        run: |
          set -euo pipefail
          {
            echo "### school-election ${GITHUB_REF_NAME}"
            echo
            if [ "$MOVE_LINE" = "yes" ]; then
              echo "Deployments follow the \`${LINE}\` line of both images (deploy/README.md) and pick this release up with their next nightly update."
            else
              echo "The \`${LINE}\` line does not move to this release: ${LINE_NEWER} is newer. A host runs this release only with \`${GITHUB_REF_NAME}\` in place of \`${LINE}\` in its unit files."
            fi
            echo
            echo '```'
            echo "${APP_IMAGE}:${GITHUB_REF_NAME}@${APP_DIGEST}"
            echo "${POSTGRES_IMAGE}:${GITHUB_REF_NAME}@${POSTGRES_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release notes
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # One at a time: "Latest" is decided from the tags the remote has at
    # that moment, and two jobs deciding it at once could leave it on the
    # older release. Every job waits its turn: by default a group keeps one
    # pending job and cancels the one before it, which would leave a tag
    # pushed with two others without its Release.
    concurrency:
      group: release-notes
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag, for the previous release and its migrations.
          fetch-depth: 0

      # No npm cache: the script has no dependencies, and a release run
      # takes nothing from a cache another run could have filled.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      # Expansions go through env rather than straight into the script body
      # (see "Report the release").
      - name: Write the release notes
        id: notes
        env:
          APP_DIGEST: ${{ needs.publish.outputs.app-digest }}
          POSTGRES_DIGEST: ${{ needs.publish.outputs.postgres-digest }}
          LINE: ${{ needs.publish.outputs.line }}
          LINE_MOVED: ${{ needs.publish.outputs.line-moved }}
          LINE_NEWER: ${{ needs.publish.outputs.line-newer }}
        run: |
          set -euo pipefail
          release="${GITHUB_REF_NAME}"
          # The release tags the remote has now, in version order; this one must
          # be among them. The remote's, not the checkout's: a tag pushed since
          # the checkout decides "Latest" as much as the ones before.
          git ls-remote --tags --refs origin 'refs/tags/v[0-9]*' | sed 's|.*refs/tags/||' | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V > tags.txt
          grep -qx "$release" tags.txt || { echo "Refusing to write notes: ${release} is not a tag of the repository" >&2; exit 1; }
          previous="$(grep -x -B1 "$release" tags.txt | head -n 1 | grep -vx "$release" || true)"
          latest=false
          if [ "$(tail -n 1 tags.txt)" = "$release" ]; then latest=true; fi
          # The migrations a release brings, as its migrator reads them
          # (apps/api/scripts/migrate.ts): the .sql files of apps/api/migrations.
          migrations_at() {
            local ref="$1"
            git ls-tree --name-only "$ref" -- apps/api/migrations/ | grep '\.sql$' | sed 's|.*/||' | paste -sd, -
          }
          previous_migrations=""
          if [ -n "$previous" ]; then previous_migrations="$(migrations_at "$previous")"; fi
          node scripts/release-notes.mjs \
            --tag="$release" --previous="$previous" \
            --app="${APP_IMAGE}:${release}@${APP_DIGEST}" \
            --postgres="${POSTGRES_IMAGE}:${release}@${POSTGRES_DIGEST}" \
            --line="$LINE" --line-moved="$LINE_MOVED" --line-newer="$LINE_NEWER" \
            --migrations="$(migrations_at "$release")" --previous-migrations="$previous_migrations" \
            --repository="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" > notes.md
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

      # The generated part comes from the API, so a Release that exists
      # (a re-run) gets the same notes as a new one. Latest is the highest
      # release tag, not the newest Release: a patch on an older line is
      # never "Latest".
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS: ${{ steps.notes.outputs.previous }}
          LATEST: ${{ steps.notes.outputs.latest }}
        run: |
          set -euo pipefail
          release="${GITHUB_REF_NAME}"
          {
            cat notes.md
            echo
            if [ -n "$PREVIOUS" ]; then
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$release" -f previous_tag_name="$PREVIOUS" -f target_commitish="$GITHUB_SHA" --jq .body
            else
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$release" -f target_commitish="$GITHUB_SHA" --jq .body
            fi
          } > release.md
          if gh release view "$release" --json id >/dev/null 2>&1; then
            gh release edit "$release" --title "$release" --notes-file release.md --latest="$LATEST"
            echo "Replaced the notes of the Release ${release}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$release" --verify-tag --title "$release" --notes-file release.md --latest="$LATEST"
          fi
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${release}" | tee -a "$GITHUB_STEP_SUMMARY"

  # Bound registry growth. Each release adds an index per image, tagged
  # with the release, the immutable sha-<commit> and the moving line tag,
  # its two entries and their three signatures, which cosign stores as
  # tagged artifacts next to the image and which are newer than it, so
  # pruning by age never leaves an image without its signature. Keep enough
  # history that a host can be put back on a recent release by hand.
  cleanup-packages:
    name: Prune old versions
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: school-election
          package-type: container
          min-versions-to-keep: 20
          delete-only-untagged-versions: false
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: school-election-postgres
          package-type: container
          min-versions-to-keep: 20
          delete-only-untagged-versions: false
