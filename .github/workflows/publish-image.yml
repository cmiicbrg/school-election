name: Publish Image

# Releases are cut by pushing a v* tag. Deliberately NOT on every push to
# main: that produces a stream of throwaway versions and a mutable `latest`
# that tracks the branch rather than a release. The Dockerfile is still built
# and smoke-tested on every pull request by the `image` job in ci.yml.
'on':
  workflow_dispatch: {}
  push:
    tags:
      # v[0-9]* rather than v*: the guard below requires a digit after the v,
      # and a trigger that admits tags the guard then rejects would fail the
      # workflow on a tag it should simply have ignored.
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scoped to the job that actually pushes, rather than granted to every job.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # workflow_dispatch can target any ref, so refuse anything that is not a
      # release tag rather than publishing from an arbitrary branch. The tag
      # becomes APP_VERSION, so it must also be a value the app accepts
      # (apps/api/config.ts), or the published image would refuse to start.
      - name: Verify release tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eqx 'v[0-9][0-9A-Za-z.+_-]{0,62}'; then
            echo "Refusing to publish: expected a v<version> tag, got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/school-election
          # Immutable per-commit sha- tags plus the release tag itself. Only
          # tags reach this workflow, so `latest` follows the newest release
          # rather than the default branch.
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reported by /api/health, so an operator can confirm what a deploy
          # started. The guard above has checked ref_name.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}

      # Deployments pin images by digest, so surface it instead of making
      # whoever deploys resolve the manifest by hand.
      - name: Report deployment digest
        # Expansions go through env rather than straight into the script body:
        # inlining ${{ ... }} splices the value into the shell source before it
        # runs, which is how a crafted value becomes executable code.
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### school-election"
            echo
            echo 'Pin in the deployment .env (see deploy/README.md):'
            echo
            echo '```'
            echo "IMAGE=ghcr.io/${OWNER}/school-election:${GITHUB_REF_NAME}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Bound registry growth. Each release adds three tags (the v* tag, an
  # immutable sha-<commit> and latest). Deployments pin by digest, so keep
  # enough history that rolling back to a recent release still resolves.
  cleanup-packages:
    name: Prune old versions
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: school-election
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
