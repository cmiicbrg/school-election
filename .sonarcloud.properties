# SonarCloud automatic analysis.
#
# Two rules conflict with how this repository is built, so they are switched
# off for exactly the files they misjudge:
#
# - plsql:S1192 (repeated string literal): the .sql files are PostgreSQL
#   migrations and test fixtures, analysed by rules written for Oracle
#   PL/SQL. Their repeated literals are state names in CHECK constraints,
#   defaults and trigger arguments, error codes, and fixture ids; DDL has no
#   constants to put them in.
# - docker:S8431 (tag or digest, not both): base images are pinned by tag
#   and digest on purpose (AGENTS.md): the digest makes the build
#   reproducible, and the tag tells readers and Dependabot which version it is.
sonar.issue.ignore.multicriteria=sqlLiterals,dockerPins
sonar.issue.ignore.multicriteria.sqlLiterals.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.sqlLiterals.resourceKey=**/*.sql
sonar.issue.ignore.multicriteria.dockerPins.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.dockerPins.resourceKey=Dockerfile
