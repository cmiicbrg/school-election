sonar.projectKey=cmiicbrg_school-election
sonar.organization=cmiicbrg
sonar.sourceEncoding=UTF-8

# Sources and tests are told apart by name, as the repository lays them
# out: every *.test.ts and *.test.mjs, every test/ directory and the
# Playwright journeys are tests; what npm, the build and the screenshot
# run write is nobody's.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs,**/test/**,e2e/**
sonar.test.exclusions=**/node_modules/**,**/dist/**
sonar.exclusions=**/node_modules/**,**/dist/**,coverage/**,docs/anleitung/**,**/*.test.ts,**/*.test.mjs,**/test/**,e2e/**

# Coverage is the one lcov file `npm run test:coverage` writes, with paths
# relative to this file: CI's test job uploads it and the sonarqube job
# downloads it before the scan. The Vue components and the app's entry are
# exercised by the browser journeys, which no unit coverage sees.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.vue,apps/web/src/main.ts
