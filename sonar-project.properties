sonar.projectKey=cmiicbrg_school-election
sonar.organization=cmiicbrg
sonar.sourceEncoding=UTF-8

# Sources and tests are told apart by name, as the repository lays them
# out: every *.test.ts and *.test.mjs, every test/ directory and the
# Playwright journeys are tests; what npm, the build and the screenshot
# run write is nobody's.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs,**/test/**,e2e/**
sonar.test.exclusions=**/node_modules/**,**/dist/**
sonar.exclusions=**/node_modules/**,**/dist/**,coverage/**,docs/anleitung/**,**/*.test.ts,**/*.test.mjs,**/test/**,e2e/**

# Coverage is the one lcov file `npm run test:coverage` writes, with paths
# relative to this file: CI's test job uploads it and the sonarqube job
# downloads it before the scan. The Vue components and the app's entry are
# exercised by the browser journeys, which no unit coverage sees.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.vue,apps/web/src/main.ts

# The migrations are PostgreSQL. By default .sql is the PL/SQL analyzer's,
# which parses them as Oracle and warns on every statement; the suffix
# lists of the two must not overlap, or the scan refuses the file.
sonar.postgres.file.suffixes=sql
sonar.plsql.file.suffixes=pks,pkb

# Work that must happen in order (audit events chaining to the one before,
# rows written in one transaction) is a plain loop with await in it, as
# AGENTS.md says; the rule against it is noise here.
# The PostgreSQL image starts as root and steps down to the postgres user
# itself, as the upstream image does: its entrypoint takes ownership of a
# fresh data directory first. A USER instruction would break that first
# start; the privileges the container keeps are the upstream image's.
sonar.issue.ignore.multicriteria=awaitInLoopTs,awaitInLoopJs,postgresEntrypoint
sonar.issue.ignore.multicriteria.awaitInLoopTs.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.awaitInLoopTs.resourceKey=**/*
sonar.issue.ignore.multicriteria.awaitInLoopJs.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.awaitInLoopJs.resourceKey=**/*
sonar.issue.ignore.multicriteria.postgresEntrypoint.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.postgresEntrypoint.resourceKey=deploy/postgres/Dockerfile
